{% extends 'base.html' %}\

{% block title %} Update{% endblock title %}

{% block body %}
    

    <!-- Form -->
    <div class="container my-3">
        <h2>
            Update Your ToDo:
        </h2>
        <form action="/update/{{todo.sno}}" method="POST">
            <div class="mb-3">
                <label for="title" class="form-label">ToDo Title</label>
                <input type="text" class="form-control" id="title" value="{{todo.title}}" name="title" aria-describedby="title">
                <!-- <div id="title" class="form-text">We'll never share your email with anyone else.</div> -->
            </div>
            <div class="mb-3">
                <label for="desc" class="form-label">ToDo Description</label>
                <input type="text" class="form-control" name="desc" value="{{todo.desc}}" id="desc">
            </div>
            <button type="submit" class="btn btn-outline-dark">Update</button>
        </form>
    </div>
